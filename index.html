<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Camera Pinch Zoom (Fixed)</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #000;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            touch-action: none;
        }
        #container {
            position: relative;
            width: 100%;
            max-width: 500px;
            height: 70vh;
            overflow: hidden;
        }
        #video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }
        #zoom-display {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0,0,0,0.7);
            padding: 10px;
            border-radius: 5px;
        }
        #status {
            margin-top: 20px;
            padding: 10px;
        }
    </style>
</head>
<body>
    <h1>Camera Pinch Zoom</h1>
    <div id="container">
        <video id="video" autoplay playsinline muted></video>
        <div id="zoom-display">Zoom: 1x</div>
    </div>
    <div id="status">Initializing camera...</div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const video = document.getElementById('video');
            const zoomDisplay = document.getElementById('zoom-display');
            const statusElement = document.getElementById('status');
            
            let stream = null;
            let videoTrack = null;
            let initialDistance = null;
            let currentZoom = 1;
            let maxZoom = 1;
            let minZoom = 1;
            let lastZoomTime = 0;
            let isZoomSupported = false;

            async function initCamera() {
                try {
                    statusElement.textContent = "Accessing camera...";
                    
                    stream = await navigator.mediaDevices.getUserMedia({
                        video: {
                            facingMode: 'environment',
                            width: { ideal: 1280 },
                            height: { ideal: 720 }
                        }
                    });
                    
                    video.srcObject = stream;
                    videoTrack = stream.getVideoTracks()[0];
                    
                    // Check zoom capabilities
                    const capabilities = videoTrack.getCapabilities();
                    if (capabilities.zoom) {
                        isZoomSupported = true;
                        minZoom = capabilities.zoom.min;
                        maxZoom = capabilities.zoom.max;
                        currentZoom = minZoom;
                        statusElement.textContent = "Pinch with two fingers to zoom";
                    } else {
                        statusElement.textContent = "Zoom not supported by your camera";
                    }
                    
                    updateZoomDisplay();
                    setupTouchEvents();
                    
                } catch (err) {
                    statusElement.textContent = `Error: ${err.message}`;
                    console.error("Camera error:", err);
                }
            }

            function setupTouchEvents() {
                video.addEventListener('touchstart', handleTouchStart, { passive: false });
                video.addEventListener('touchmove', handleTouchMove, { passive: false });
                video.addEventListener('touchend', handleTouchEnd);
            }

            function handleTouchStart(e) {
                if (e.touches.length === 2) {
                    e.preventDefault();
                    initialDistance = getDistance(e.touches[0], e.touches[1]);
                }
            }

            function handleTouchMove(e) {
                if (e.touches.length === 2 && initialDistance !== null && isZoomSupported) {
                    e.preventDefault();
                    
                    const now = Date.now();
                    // Throttle zoom updates to 60ms
                    if (now - lastZoomTime < 60) return;
                    
                    const currentDistance = getDistance(e.touches[0], e.touches[1]);
                    const scale = currentDistance / initialDistance;
                    
                    let newZoom = currentZoom * scale;
                    newZoom = Math.max(minZoom, Math.min(newZoom, maxZoom));
                    
                    if (Math.abs(newZoom - currentZoom) > 0.05) {
                        applyZoom(newZoom);
                        lastZoomTime = now;
                    }
                }
            }

            function handleTouchEnd() {
                initialDistance = null;
            }

            function getDistance(touch1, touch2) {
                const dx = touch1.clientX - touch2.clientX;
                const dy = touch1.clientY - touch2.clientY;
                return Math.sqrt(dx * dx + dy * dy);
            }

            async function applyZoom(zoomLevel) {
                try {
                    await videoTrack.applyConstraints({
                        advanced: [{ zoom: zoomLevel }]
                    });
                    currentZoom = zoomLevel;
                    updateZoomDisplay();
                } catch (err) {
                    console.error("Zoom error:", err);
                }
            }

            function updateZoomDisplay() {
                zoomDisplay.textContent = `Zoom: ${currentZoom.toFixed(1)}x`;
            }

            // Cleanup
            window.addEventListener('beforeunload', () => {
                if (stream) {
                    stream.getTracks().forEach(track => track.stop());
                }
            });

            // Initialize
            initCamera();
        });
    </script>
</body>
</html>
