<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Camera Zoom with Pinch Gesture</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #000;
            color: white;
            font-family: Arial, sans-serif;
            touch-action: none;
        }
        
        #camera-container {
            position: relative;
            width: 100%;
            max-width: 500px;
            height: 80vh;
            overflow: hidden;
            margin-top: 20px;
        }
        
        #video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1); /* Mirror effect for front camera */
        }
        
        #zoom-info {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px;
            border-radius: 5px;
        }
        
        #instructions {
            margin-top: 20px;
            text-align: center;
            padding: 0 20px;
        }
        
        .error {
            color: red;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>Camera Pinch-to-Zoom Demo</h1>
    
    <div id="camera-container">
        <video id="video" autoplay playsinline muted></video>
        <div id="zoom-info">Zoom: 1x</div>
    </div>
    
    <div id="instructions">
        Use two fingers to zoom in/out on mobile devices
    </div>
    
    <div id="error" class="error"></div>
    
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const video = document.getElementById('video');
            const zoomInfo = document.getElementById('zoom-info');
            const errorElement = document.getElementById('error');
            
            let stream = null;
            let videoTrack = null;
            let initialDistance = null;
            let currentZoom = 1;
            let maxZoom = 5;
            let minZoom = 1;
            
            try {
                // Request camera access
                stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: 'environment', // Use back camera
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    }
                });
                
                video.srcObject = stream;
                videoTrack = stream.getVideoTracks()[0];
                
                // Check zoom capabilities
                const capabilities = videoTrack.getCapabilities();
                if ('zoom' in capabilities) {
                    maxZoom = capabilities.zoom.max;
                    minZoom = capabilities.zoom.min;
                    currentZoom = capabilities.zoom.min;
                } else {
                    errorElement.textContent = 'Your device camera doesn\'t support zoom';
                }
                
                updateZoomInfo();
                
                // Touch event handlers for pinch zoom
                video.addEventListener('touchstart', handleTouchStart, { passive: false });
                video.addEventListener('touchmove', handleTouchMove, { passive: false });
                video.addEventListener('touchend', handleTouchEnd, { passive: false });
                
            } catch (err) {
                errorElement.textContent = `Error accessing camera: ${err.message}`;
                console.error('Camera error:', err);
            }
            
            function handleTouchStart(e) {
                if (e.touches.length === 2) {
                    e.preventDefault();
                    initialDistance = getDistance(e.touches[0], e.touches[1]);
                }
            }
            
            function handleTouchMove(e) {
                if (e.touches.length === 2 && initialDistance !== null) {
                    e.preventDefault();
                    
                    const currentDistance = getDistance(e.touches[0], e.touches[1]);
                    const scale = currentDistance / initialDistance;
                    
                    // Calculate new zoom level
                    let newZoom = currentZoom * scale;
                    
                    // Clamp zoom between min and max
                    newZoom = Math.max(minZoom, Math.min(newZoom, maxZoom));
                    
                    // Apply zoom if changed
                    if (Math.abs(newZoom - currentZoom) > 0.01) {
                        applyZoom(newZoom);
                    }
                }
            }
            
            function handleTouchEnd() {
                initialDistance = null;
            }
            
            function getDistance(touch1, touch2) {
                const dx = touch1.clientX - touch2.clientX;
                const dy = touch1.clientY - touch2.clientY;
                return Math.sqrt(dx * dx + dy * dy);
            }
            
            async function applyZoom(zoomLevel) {
                if (!videoTrack) return;
                
                try {
                    await videoTrack.applyConstraints({
                        advanced: [{ zoom: zoomLevel }]
                    });
                    currentZoom = zoomLevel;
                    updateZoomInfo();
                } catch (err) {
                    console.error('Zoom error:', err);
                }
            }
            
            function updateZoomInfo() {
                zoomInfo.textContent = `Zoom: ${currentZoom.toFixed(1)}x`;
            }
            
            // Clean up on page unload
            window.addEventListener('beforeunload', () => {
                if (stream) {
                    stream.getTracks().forEach(track => track.stop());
                }
            });
        });
    </script>
</body>
</html>
