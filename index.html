<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Smooth Camera Pinch Zoom</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #000;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            touch-action: none;
            overflow: hidden;
        }
        #camera-container {
            position: relative;
            width: 100%;
            max-width: 500px;
            height: 70vh;
            overflow: hidden;
        }
        #video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }
        #zoom-info {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0,0,0,0.7);
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 14px;
        }
        #status {
            margin-top: 15px;
            padding: 10px;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>Smooth Camera Zoom</h1>
    <div id="camera-container">
        <video id="video" autoplay playsinline muted></video>
        <div id="zoom-info">Zoom: 1×</div>
    </div>
    <div id="status">Starting camera...</div>

    <script>
        (async function() {
            const video = document.getElementById('video');
            const zoomInfo = document.getElementById('zoom-info');
            const statusEl = document.getElementById('status');
            
            let stream = null;
            let videoTrack = null;
            let zoomTarget = 1;
            let currentZoom = 1;
            let minZoom = 1;
            let maxZoom = 1;
            let isZooming = false;
            let animationFrameId = null;
            let touchStartZoom = 1;
            let touchStartDistance = 0;

            // 1. Initialize camera
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: 'environment',
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    }
                });
                
                video.srcObject = stream;
                videoTrack = stream.getVideoTracks()[0];
                
                // Check zoom capabilities
                const capabilities = videoTrack.getCapabilities();
                if (capabilities.zoom) {
                    minZoom = capabilities.zoom.min;
                    maxZoom = Math.min(capabilities.zoom.max, 5); // Limit to 5x max
                    statusEl.textContent = "Use two fingers to zoom smoothly";
                } else {
                    statusEl.textContent = "Zoom not supported by your camera";
                    return;
                }
                
                updateZoomDisplay();
                setupTouchHandlers();
                startZoomAnimation();
                
            } catch (err) {
                statusEl.textContent = `Error: ${err.message}`;
                console.error("Camera error:", err);
            }

            // 2. Touch handlers for pinch zoom
            function setupTouchHandlers() {
                video.addEventListener('touchstart', handleTouchStart, { passive: false });
                video.addEventListener('touchmove', handleTouchMove, { passive: false });
                video.addEventListener('touchend', handleTouchEnd);
            }

            function handleTouchStart(e) {
                if (e.touches.length === 2) {
                    e.preventDefault();
                    touchStartDistance = getTouchDistance(e.touches);
                    touchStartZoom = currentZoom;
                    isZooming = true;
                }
            }

            function handleTouchMove(e) {
                if (isZooming && e.touches.length === 2) {
                    e.preventDefault();
                    const currentDistance = getTouchDistance(e.touches);
                    const scale = currentDistance / touchStartDistance;
                    zoomTarget = Math.max(minZoom, Math.min(touchStartZoom * scale, maxZoom));
                }
            }

            function handleTouchEnd() {
                isZooming = false;
            }

            function getTouchDistance(touches) {
                const dx = touches[0].clientX - touches[1].clientX;
                const dy = touches[0].clientY - touches[1].clientY;
                return Math.sqrt(dx * dx + dy * dy);
            }

            // 3. Smooth zoom animation
            function startZoomAnimation() {
                let lastTimestamp = 0;
                
                const animate = (timestamp) => {
                    if (!lastTimestamp) lastTimestamp = timestamp;
                    const deltaTime = timestamp - lastTimestamp;
                    lastTimestamp = timestamp;
                    
                    // Smooth interpolation
                    if (Math.abs(currentZoom - zoomTarget) > 0.01) {
                        currentZoom += (zoomTarget - currentZoom) * 0.2; // Adjust for smoother/faster
                        applyZoom(currentZoom);
                        updateZoomDisplay();
                    }
                    
                    animationFrameId = requestAnimationFrame(animate);
                };
                
                animationFrameId = requestAnimationFrame(animate);
            }

            // 4. Apply zoom to camera
            async function applyZoom(zoom) {
                try {
                    await videoTrack.applyConstraints({
                        advanced: [{ zoom: zoom }]
                    });
                } catch (err) {
                    console.warn("Zoom error:", err);
                }
            }

            function updateZoomDisplay() {
                zoomInfo.textContent = `Zoom: ${currentZoom.toFixed(1)}×`;
            }

            // Cleanup
            window.addEventListener('beforeunload', () => {
                if (animationFrameId) cancelAnimationFrame(animationFrameId);
                if (stream) stream.getTracks().forEach(t => t.stop());
            });
        })();
    </script>
</body>
</html>
